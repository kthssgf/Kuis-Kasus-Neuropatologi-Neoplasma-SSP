["Ganglioneuroma mediastinum","Tumor neuroektodermal mediastinum, tidak sesuai lokasi dan histologi."]]),
Q(3,"Pria 62 tahun, perokok berat, kejang baru. MRI: beberapa lesi bulat berbatas tegas dengan edema di perbatasan gray-white. Pernyataan yang paling tepat adalah…",[
["Metastasis intrakranial; berbatas tegas, berbeda dengan tumor primer yang infiltratif","✔ Slide: metastasis well-demarcated dan merupakan tumor SSP tersering; tumor primer infiltratif. Asal tersering paru, payudara, GIT."],
["Glioblastoma multipel; infiltratif tanpa batas","GBM batas tidak tegas dan umumnya tunggal."],
["Meningioma multipel; hiperostosis","Berbasis dura, bukan lesi parenkimal di gray-white junction."],
["Medulloblastoma; serebelum anak","Usia dan lokasi tidak cocok."],
["Schwannoma bilateral; N. VIII","Bukan lesi parenkimal otak multipel."]]),
Q(3,"Anak 4 tahun dengan muntah pagi dan sakit kepala. MRI: massa di ventrikel IV dengan pelebaran ventrikel lateral dan III. Mekanisme klinis dan kemungkinan tumornya adalah…",[
["Hidrosefalus obstruktif akibat massa ventrikel IV; ependimoma","✔ Slide: ependimoma = ventrikel IV. Massa menyumbat aliran LCS (ventrikel → subarachnoid), meningkatkan TIK (nyeri kepala, muntah)."],
["Hidrosefalus komunikans akibat gangguan resorpsi di granulasio arachnoidea; meningioma","Pada kasus ini obstruksi terjadi di dalam sistem ventrikel; meningioma bukan tumor ventrikel IV."],
["Produksi LCS berlebih; glioblastoma","Tidak sesuai lokasi/usia dan mekanismenya obstruktif."],
["Atrofi kortikal ex vacuo; astrositoma fibriler","Ventrikel melebar karena obstruksi, bukan atrofi."],
["Herniasi tonsil; Arnold-Chiari","Tidak ada massa di ventrikel IV pada Chiari."]]),
Q(3,"Bayi dengan meningomielokel lumbosakral dan hidrosefalus. MRI: tonsil serebelum dan medula turun melalui foramen magnum. Kelainan fossa posterior yang menyertai adalah…",[
["Malformasi Arnold-Chiari","✔ Slide malformasi: Arnold-Chiari = herniasi infratentorial; sering menyertai spina bifida (defek tabung saraf) dan menyebabkan hidrosefalus."],
["Malformasi Dandy-Walker","Kista fossa posterior dengan hipoplasia vermis, bukan herniasi tonsil."],
["Holoprosensefali","Kelainan otak depan dengan anomali wajah."],
["Polimikrogiria","Kelainan korteks, tidak menjelaskan herniasi."],
["Siringomielia saja","Rongga di medula spinalis; tidak menjelaskan herniasi kaudal."]]),
Q(4,"Pria 40 tahun dengan NF1. Biopsi lesi pleksiform di lengan: selularitas meningkat dan atipia inti, tetapi aktivitas mitosis rendah dan tanpa nekrosis. Interpretasi yang paling tepat adalah…",[
["ANNUBP; potensi biologis belum pasti, tidak semua berprogresi menjadi MPNST","✔ Slide hubungan NF1: plexiform neurofibroma → ANNUBP → MPNST low/high grade. ANNUBP = lesi dengan potensi biologis tidak pasti; butuh sampling representatif dan korelasi klinis-radiologis."],
["Neurofibroma pleksiform biasa tanpa risiko","Atipia dan selularitas meningkat bukan temuan neurofibroma biasa."],
["MPNST high-grade","Kriteria mitosis tinggi dan nekrosis belum terpenuhi."],
["Schwannoma","Tidak ada Antoni A/B, Verocay, maupun kapsul."],
["Neuroblastoma","Tumor blast adrenal; tidak sesuai."]])
];

const $=s=>document.querySelector(s),app=$("#app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let qs=[],i=0,score=0,sc={1:[0,0],2:[0,0]},res=[],done=false;
const lvl=l=>l<=2?"C1–C2":"C3–C4";
const grp=l=>l<=2?1:2;

function home(){
  app.innerHTML=`<div class="card"><h1>Kuis Kasus Neuropatologi: Neoplasma SSP</h1>
  <p class="mut">30 soal (15 C1–C2 dan 15 C3–C4) dengan 5 pilihan. Urutan soal dan pilihan diacak setiap kali memulai. Setelah menjawab, pembahasan semua opsi ditampilkan beserta clinical reasoning.</p>
  <button class="btn" id="go">Mulai kuis</button></div>`;
  $("#go").onclick=start;
}
function start(){
  qs=sh(DATA).map(q=>({...q,o:sh(q.o.map((x,k)=>({t:x[0],e:x[1],ok:k===0})))}));
  i=0;score=0;sc={1:[0,0],2:[0,0]};res=[];show();
}
function show(){
  const q=qs[i],L="ABCDE";done=false;
  app.innerHTML=`<div class="card"><div class="mut">Soal ${i+1} dari ${qs.length} · Skor ${score}</div>
  <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
  <span class="tag">${lvl(q.lv)}</span>
  <p class="stem">${q.s}</p>
  <div id="ops">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="L">${L[k]}.</span><span class="oc">${o.t}<span class="ex"></span></span></button>`).join("")}</div>
  <div class="row"><span class="mut" id="fb"></span><button class="btn" id="nx" style="display:none">${i+1<qs.length?"Soal berikutnya":"Lihat hasil"}</button></div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $("#nx").onclick=()=>{i++;i<qs.length?show():finish();window.scrollTo(0,0)};
}
function pick(k){
  if(done)return;done=true;
  const q=qs[i],g=grp(q.lv),right=q.o[k].ok;
  sc[g][1]++;if(right){score++;sc[g][0]++}
  res.push(right);
  document.querySelectorAll(".opt").forEach((b,n)=>{
    const o=q.o[n];b.disabled=true;b.classList.add("show");
    b.querySelector(".ex").innerHTML=(o.ok?"":"✘ Kurang tepat: ")+o.e;
    if(o.ok)b.classList.add("ok");else if(n===k)b.classList.add("no");
  });
  $("#fb").textContent=right?"Jawaban Anda benar.":"Jawaban Anda belum tepat; pelajari pembahasan tiap opsi.";
  $("#nx").style.display="inline-block";
}
function finish(){
  const p=Math.round(score/qs.length*100);
  app.innerHTML=`<div class="card"><h1>Hasil</h1><div class="big">${score} / ${qs.length} <span class="mut">(${p}%)</span></div>
  <div class="bar"><i style="width:${p}%"></i></div>
  <p>C1–C2: <b>${sc[1][0]}/${sc[1][1]}</b> · C3–C4: <b>${sc[2][0]}/${sc[2][1]}</b></p>
  <div class="row"><button class="btn" id="re">Ulangi (soal diacak)</button></div></div>`;
  $("#re").onclick=start;
}
home();
</script>
</body>
</html>
